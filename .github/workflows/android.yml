name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "web/openapi/openapi.json"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "web/openapi/openapi.json"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - name: Build and test
        working-directory: android
        run: ./gradlew :app:testDevDebugUnitTest :app:assembleDevDebug
      - uses: actions/upload-artifact@v7
        with:
          name: moves-mobile-dev-debug-apk
          path: android/app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
