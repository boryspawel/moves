name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: mvn --batch-mode verify

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Match npm version declared by web/package.json
        run: npm install --global npm@11.12.1
      - name: Regenerate lockfile for diagnosis (temporary)
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        working-directory: web
      - name: Show lockfile delta (temporary)
        run: git diff -- package-lock.json
        working-directory: web
      - run: npm ci
        working-directory: web
      - run: npm test -- --watch=false
        working-directory: web
      - run: npm run build -- --configuration production
        working-directory: web
      - run: npm run api:verify
        working-directory: web

  compose-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/compose-smoke.sh
      - run: bash scripts/production-web-smoke.sh
